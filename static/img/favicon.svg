<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
  
  <!-- Security Shield Silhouette -->
  <path d="M32 10 L48 16 C48 28 42 40 32 50 C22 40 16 28 16 16 Z" 
        fill="url(#shieldGrad)" stroke="#6366f1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High Voltage Lightning Bolt -->
  <path d="M34 14 L22 32 H31 L29 48 L42 29 H33 Z" 
        fill="url(#boltGrad)" stroke="#fbbf24" stroke-width="0.8" filter="url(#glow)"/>
</svg>
